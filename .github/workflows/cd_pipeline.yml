name: CI CD Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          cd PE03
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Train Model
        run: |
          cd PE03
          python train.py

      - name: Run Flask App & Test
        run: |
          cd PE03
          python app.py &
          sleep 5

      - name: Validate Model Output
        run: |
          response=$(curl -s -X POST http://localhost:5000/predict -H "Content-Type: application/json" -d '{"features": [6.7, 3.1, 4.4, 1.4]}')
          echo "$response"
          if [[ "$response" == *"prediction"* ]]; then
            echo "Model prediction check passed."
          else
            echo "Model prediction check failed."
            exit 1
          fi
